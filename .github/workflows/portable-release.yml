name: Build portable Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build portable package
        shell: pwsh
        run: .\build_portable.ps1

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Numerica-Portable-Windows.zip \
            --title "Numerica ${GITHUB_REF_NAME}" \
            --generate-notes
